<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Create New Request</title></head>
<body>
<!-- Mirrors crovisa.mvep.hr/NewVisaRequest: the label's "for" does not match the select's id. -->
<form action="details.html" method="get">
  <div class="form-group required">
    <label class="control-label" for="Purpose">Please select the type of visa requested and the main purpose of travel</label>
    <select id="purpose" name="Purpose" data-val-required="Please select the type of visa">
      <option value="">- Select Type -</option>
      <optgroup label="Short-Term Visa"><option value="6">Tourism</option><option value="8">Business Visit</option><option value="3">Private Visit</option></optgroup>
    </select>
  </div>
  <div class="form-group required">
    <label class="control-label" for="CaptchaCode">Please copy the security code</label>
    <img id="captcha" alt="Captcha" width="120" height="40">
    <input type="text" id="captchaCode" name="CaptchaCode" data-val-required="Please enter the code from the image">
  </div>
  <button type="submit" class="btn btn-primary">Create New Request</button>
</form>
</body></html>
