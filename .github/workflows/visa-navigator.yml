name: visa-navigator
on:
  push:
    paths: ["visa-navigator/**", ".github/workflows/visa-navigator.yml"]
  pull_request:
    paths: ["visa-navigator/**", ".github/workflows/visa-navigator.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visa-navigator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: visa-navigator/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present
