name: aiwarden
on:
  push:
    paths: ["aiwarden/**", ".github/workflows/aiwarden.yml"]
  pull_request:
    paths: ["aiwarden/**", ".github/workflows/aiwarden.yml"]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: aiwarden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: aiwarden scan --no-usage
      - name: extension unit tests
        if: hashFiles('aiwarden/extension/**/*.test.js') != ''
        run: node --test extension/
