name: backchannel
on:
  push:
    paths: ["backchannel/**", ".github/workflows/backchannel.yml"]
  pull_request:
    paths: ["backchannel/**", ".github/workflows/backchannel.yml"]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backchannel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backchannel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - run: node src/cli.ts --help
      - name: Pack, install the tarball in an empty folder, and run it
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try" && npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/backchannel-agents-*.tgz
          npx backchannel --help
          export BACKCHANNEL_HOME="$RUNNER_TEMP/h/bc" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/h/claude" CODEX_HOME="$RUNNER_TEMP/h/codex"
          npx backchannel hooks install
          npx backchannel doctor || test $? -eq 1
